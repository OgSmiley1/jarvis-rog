name: Create JARVIS Android APK (manual)

# Same schema fix as build-android.yml: a bare `workflow_dispatch:` is null and
# invalidates the whole definition.
#
# This workflow builds exactly the same artifact as build-android.yml (Android,
# preview profile). While both ran on every push to main, each push started two
# identical cloud builds and spent twice the EAS build allowance for one APK.
# The push trigger is removed here so only build-android.yml runs automatically;
# this one stays available for a manual run.
on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build JARVIS ROG Android APK
    type: build
    params:
      platform: android
      profile: preview
